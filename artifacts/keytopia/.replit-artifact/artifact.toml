kind = "web"
previewPath = "/"
title = "Keytopia Store"
description = "Premium digital AI subscriptions storefront for the Arab world. Visitors browse and search products, add to cart, and check out via WhatsApp. Includes an admin panel for product management."
version = "1.0.0"
id = "artifacts/keytopia"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20913

[services.development]
run = "pnpm --filter @workspace/keytopia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/keytopia", "run", "build" ]
serve = "static"
publicDir = "artifacts/keytopia/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20913"
BASE_PATH = "/"

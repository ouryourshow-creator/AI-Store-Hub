openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      description: Returns all products in the catalog
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      description: Add a new product to the catalog (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found

    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      description: Update an existing product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input
        "404":
          description: Product not found

    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      description: Remove a product from the catalog (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found

  /admin/promo-codes:
    get:
      operationId: listPromoCodes
      tags: [products]
      summary: List all promo codes (admin only)
      responses:
        "200":
          description: List of promo codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoCode"
    post:
      operationId: createPromoCode
      tags: [products]
      summary: Create a promo code (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeInput"
      responses:
        "201":
          description: Promo code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"
        "400":
          description: Invalid input

  /admin/promo-codes/{id}:
    delete:
      operationId: deletePromoCode
      tags: [products]
      summary: Delete a promo code (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /promo-codes/validate:
    post:
      operationId: validatePromoCode
      tags: [products]
      summary: Validate a promo code against cart products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatePromoCodeRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatePromoCodeResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PricingOption:
      type: object
      required: [duration, price]
      properties:
        duration:
          type: string
        price:
          type: number
          minimum: 0
        salePrice:
          type: ["number", "null"]

    Product:
      type: object
      required:
        - id
        - name
        - price
        - duration
        - createdAt
      properties:
        id:
          type: number
        name:
          type: string
        category:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        pricingOptions:
          type: ["array", "null"]
          items:
            $ref: '#/components/schemas/PricingOption'
        duration:
          type: string
        deliveryTime:
          type: ["string", "null"]
        activationType:
          type: ["string", "null"]
        onCustomerAccount:
          type: ["boolean", "null"]
        invitationLink:
          type: ["string", "null"]
        licenseKey:
          type: ["string", "null"]
        sharedAccount:
          type: ["boolean", "null"]
        description:
          type: ["string", "null"]
        features:
          type: ["array", "null"]
          items:
            type: string
        warrantyDuration:
          type: ["string", "null"]
        customerInfoRequired:
          type: ["array", "null"]
          items:
            type: string
        afterPurchaseInstructions:
          type: ["string", "null"]
        createdAt:
          type: string

    ProductInput:
      type: object
      required:
        - name
        - price
        - duration
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        brand:
          type: string
        coverImageUrl:
          type: string
        price:
          type: number
          minimum: 0
        salePrice:
          type: number
          minimum: 0
        pricingOptions:
          type: array
          items:
            $ref: '#/components/schemas/PricingOption'
        duration:
          type: string
          minLength: 1
        deliveryTime:
          type: string
        activationType:
          type: string
        onCustomerAccount:
          type: boolean
        invitationLink:
          type: string
        licenseKey:
          type: string
        sharedAccount:
          type: boolean
        description:
          type: string
        features:
          type: array
          items:
            type: string
        warrantyDuration:
          type: string
        customerInfoRequired:
          type: array
          items:
            type: string
        afterPurchaseInstructions:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        brand:
          type: string
        coverImageUrl:
          type: string
        price:
          type: number
          minimum: 0
        salePrice:
          type: number
          minimum: 0
        pricingOptions:
          type: array
          items:
            $ref: '#/components/schemas/PricingOption'
        duration:
          type: string
          minLength: 1
        deliveryTime:
          type: string
        activationType:
          type: string
        onCustomerAccount:
          type: boolean
        invitationLink:
          type: string
        licenseKey:
          type: string
        sharedAccount:
          type: boolean
        description:
          type: string
        features:
          type: array
          items:
            type: string
        warrantyDuration:
          type: string
        customerInfoRequired:
          type: array
          items:
            type: string
        afterPurchaseInstructions:
          type: string

    PromoCode:
      type: object
      required: [id, code, percentage, active, createdAt]
      properties:
        id:
          type: number
        code:
          type: string
        percentage:
          type: number
          minimum: 1
          maximum: 100
        applicableProductIds:
          type: ["array", "null"]
          items:
            type: number
        active:
          type: boolean
        createdAt:
          type: string

    PromoCodeInput:
      type: object
      required: [code, percentage]
      properties:
        code:
          type: string
          minLength: 1
        percentage:
          type: number
          minimum: 1
          maximum: 100
        applicableProductIds:
          type: array
          items:
            type: number

    ValidatePromoCodeRequest:
      type: object
      required: [code, productIds]
      properties:
        code:
          type: string
        productIds:
          type: array
          items:
            type: number

    ValidatePromoCodeResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        percentage:
          type: number
        code:
          type: string
